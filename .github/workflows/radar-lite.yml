name: Radar Lite

on:
  push:
    branches: [main]
    paths:
      - "industry/**"
      - "scripts/radar-lite.mjs"
      - "scripts/radar-lite/**"
      - ".github/workflows/radar-lite.yml"
  schedule:
    - cron: "15 23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar-lite-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false

      - name: Build daily radar
        env:
          LLM_BASE_URL: ${{ secrets.RADAR_LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.RADAR_LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.RADAR_LLM_MODEL }}
        run: node scripts/radar-lite.mjs

      - name: Persist latest snapshot
        run: |
          mkdir -p "$RUNNER_TEMP/radar-snapshot"
          cp radar/index.html radar/latest.json "$RUNNER_TEMP/radar-snapshot/"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p radar
          cp "$RUNNER_TEMP/radar-snapshot/index.html" "$RUNNER_TEMP/radar-snapshot/latest.json" radar/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar/index.html radar/latest.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh daily radar snapshot [skip ci]"
          git push origin HEAD:main

      - name: Configure Pages if enabled
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload dashboard
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: radar

      - name: Deploy Pages
        if: steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
